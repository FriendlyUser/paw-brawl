# Test and build the game on every push and pull request, then publish dist/ to
# GitHub Pages (https://friendlyuser.github.io/paw-brawl/) on pushes to main.
# The built site is also attached to each run as the "paw-brawl-dist" artifact.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one but never cancels a
# deployment that is already running.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Engine tests (every move connects, CPU matches run clean)
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: paw-brawl-dist
          path: dist
          retention-days: 30

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
